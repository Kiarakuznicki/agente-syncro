<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>chatbot syncro</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="imagenes/Capa 1.png" alt="">
        <div class="brand-text">
          <h1>SYN<span class="accent">CRO</span></h1>
          <span>Asistente virtual</span>
        </div>
      </div>
      <button class="close-btn" id="closeBtn" aria-label="Cerrar chat" title="Cerrar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="4" x2="20" y2="20" />
          <line x1="20" y1="4" x2="4" y2="20" />
        </svg>
      </button>
    </header>

    <main class="chat-container" id="chatContainer">
      <div id="chat" class="chat"></div>
    </main>

    <footer class="input-bar">
      <form id="chatForm" autocomplete="off">
        <input type="text" id="pregunta" placeholder="Escribí tu consulta..." required />
        <button type="submit" id="sendBtn" aria-label="Enviar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
