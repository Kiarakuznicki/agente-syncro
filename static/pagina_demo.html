<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página de prueba</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #000;
    min-height: 100vh;
  }

  .contenido-ejemplo {
    max-width: 800px;
    margin: 60px auto;
    padding: 0 24px;
  }
  .contenido-ejemplo h1 { color: #fff; }
  .contenido-ejemplo a { color: greenyellow; font-size: 24px;}

  .chat-widget-boton {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #c6ff3d;
    box-shadow: 0 4px 20px rgba(198, 255, 61, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    color: #10130a;
    z-index: 9999;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .chat-widget-boton:hover { transform: scale(1.06); background: #9be600; }
  .chat-widget-boton svg { width: 26px; height: 26px; }
  .chat-widget-boton .icono-cerrar { display: none; }
  .chat-widget-boton.abierto .icono-chat { display: none; }
  .chat-widget-boton.abierto .icono-cerrar { display: block; }

  .chat-widget-ventana {
    position: fixed;
    bottom: 96px;
    right: 24px;
    width: 380px;
    height: 620px;
    max-height: 75vh;
    background: #0c0c0e;
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    z-index: 9998;
    opacity: 0;
    transform: translateY(16px) scale(0.98);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .chat-widget-ventana.abierta {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .chat-widget-ventana iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  @media (max-width: 480px) {
    .chat-widget-ventana {
      width: calc(100vw - 24px);
      height: calc(100vh - 120px);
      right: 12px;
      bottom: 88px;
    }
  }
</style>
</head>
<body>

  <div class="contenido-ejemplo">
    <h1>Página de prueba</h1>
    <a href="static/index.html" target="_blank">Interfaz principal del chatbot</a>
  </div>

  <button class="chat-widget-boton" id="botonChat" aria-label="Abrir chat">
    <svg class="icono-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
    <svg class="icono-cerrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="4" y1="4" x2="20" y2="20" />
      <line x1="20" y1="4" x2="4" y2="20" />
    </svg>
  </button>

  <div class="chat-widget-ventana" id="ventanaChat">
    <iframe id="iframeChat" title="Asistente virtual"></iframe>
  </div>

  <script>

    const URL_CHATBOT = "/chatbot.html";

    const boton = document.getElementById("botonChat");
    const ventana = document.getElementById("ventanaChat");
    const iframe = document.getElementById("iframeChat");

    let yaCargado = false;

    function abrirChat() {
      if (!yaCargado) {
        iframe.src = URL_CHATBOT;
        yaCargado = true;
      }
      ventana.classList.add("abierta");
      boton.classList.add("abierto");
    }

    function cerrarChat() {
      ventana.classList.remove("abierta");
      boton.classList.remove("abierto");
    }

    boton.addEventListener("click", () => {
      ventana.classList.contains("abierta") ? cerrarChat() : abrirChat();
    });

    window.addEventListener("message", (evento) => {
      if (evento.data && evento.data.tipo === "cerrarChatWidget") {
        cerrarChat();
      }
    });
  </script>

</body>
</html>
